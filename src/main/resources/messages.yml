# World reset
guildResetTargetNotFound: "<red>No guild matches '<target>'. Enter the guild UUID or full name."
guildWorldResetConfirm: "<red>Reset the world for <guild>?<newline><yellow>This removes all blocks and entities in <world>. Players leave the world first. The guild and its members stay the same. The world spawn and warps in this world are removed. Generate a new world after the reset.<newline>A backup is kept for <days> days. Backups needed by an incomplete reset are kept until recovery.<newline>With Oasis, the reset also deletes the block history of the old world.<newline><gold>To confirm, enter <command>"
