###################
#                 #
#   Plex Guilds   #
#                 #
###################

guilds:
  log-chat-message: true
  guests:
    # Use a positive whole number followed by m, h, or d (for example 30m, 12h, 7d).
    default-duration: 24h
    max-duration: 30d
  worlds:
    # Border width in blocks for every terrain type. Use an even number from 16 to 59999968.
    size: 500000
    # Keep backups for unfinished resets until staff finish the reset.
    backup-retention-days: 7
